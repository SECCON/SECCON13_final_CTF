<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Reversing</title>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
  </head>
  <body>
    <header>
      <h1>Login - {{ config.game.title }}</h1>
    </header>

    <main>
      {% with messages = get_flashed_messages() %}
      {% if messages %}
      <div>
        {% for message in messages %}
        <p class="notice">Error: {{ message }}</p>
        {% endfor %}
      </div>
      {% endif %}
      {% endwith %}
      <form method="POST">
        <div style="text-align: center">
          <label for="token">Team Token</label>
          <br>
          <input type="text" id="token" name="token" style="width: 80%" required>
          <input type="submit" value="Login">
        </div>
      </form>
    </main>
  </body>
</html>
