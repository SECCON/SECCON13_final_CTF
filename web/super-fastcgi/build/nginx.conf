events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        # Block requests containing GiveMeFlag in headers
        if ($http_givemeflag) {
            return 403;
        }

        # Forward all other requests to port 9090
        location / {
            proxy_pass http://server:9090;
        }
    }
}
