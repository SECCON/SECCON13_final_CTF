events {
    worker_connections 1024;
}

http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m max_size=10g inactive=60m use_temp_path=off;

    server {
        listen 443 ssl;
        server_name ${APP_HOSTNAME};

        ssl_certificate /etc/nginx/certs/_.seccon.games.crt;
        ssl_certificate_key /etc/nginx/certs/_.seccon.games.key;

        location / {
            proxy_pass http://app:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location /static {
            proxy_pass http://app:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_cache static_cache;
            proxy_cache_valid any 5m;
            add_header X-Cache-Status $upstream_cache_status;
            expires 1h;
        }
    }

    server {
        listen 443 ssl;
        server_name ${AUTH_HOSTNAME};

        ssl_certificate /etc/nginx/certs/_.seccon.games.crt;
        ssl_certificate_key /etc/nginx/certs/_.seccon.games.key;

        location / {
            proxy_pass http://auth:3000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }

    server {
        listen 443 ssl;
        server_name ${ADMIN_HOSTNAME};

        ssl_certificate /etc/nginx/certs/_.seccon.games.crt;
        ssl_certificate_key /etc/nginx/certs/_.seccon.games.key;

        location / {
            proxy_pass http://admin:5000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }

    server {
        listen 443 default_server ssl;

        ssl_certificate /etc/nginx/certs/_.seccon.games.crt;
        ssl_certificate_key /etc/nginx/certs/_.seccon.games.key;

        return 404;
    }
}
