name: negrange
services:
  challenge:
    build:
      context: .
      dockerfile: ./build/Dockerfile
      args:
        FLAG: "flag{***REDACTED***}"
    working_dir: /home/pwn
    container_name: negrange
    ulimits:
      nproc: 65535
      core: 0
    ports:
      - "3729:9999"
    entrypoint: /etc/init.sh
    init: true
    restart: always
